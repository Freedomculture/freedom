<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THE COLLECTION | FREEDOM CULTURE</title>

    <link rel="stylesheet" href="./style.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080808;
            color: white;
            font-family: 'Montserrat', sans-serif;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 6%;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-weight: 900;
            font-size: 20px;
        }

        .logo span,
        .products-section h1 span {
            color: #aaa;
        }

        /* LIQUID GLASS BACK HOME BUTTON */

        .glass-collection-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 27px;
            color: #fff;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.2px;

            background: linear-gradient(
                135deg,
                rgba(255,255,255,0.20),
                rgba(255,255,255,0.04)
            );

            border: 1px solid rgba(255,255,255,0.38);
            border-radius: 50px;

            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);

            box-shadow:
                inset 0 1px 1px rgba(255,255,255,0.45),
                inset 0 -1px 1px rgba(255,255,255,0.08),
                0 8px 30px rgba(0,0,0,0.35);

            transition: all 0.35s ease;
            overflow: hidden;
            isolation: isolate;
        }

        .glass-collection-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 70%;
            height: 100%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.25),
                transparent
            );

            transform: skewX(-25deg);
            transition: 0.6s ease;
            pointer-events: none;
        }

        .glass-collection-btn:hover {
            background: rgba(255,255,255,0.22);
            border-color: rgba(255,255,255,0.7);
            transform: translateY(-3px);

            box-shadow:
                inset 0 1px 2px rgba(255,255,255,0.5),
                0 12px 35px rgba(255,255,255,0.10);
        }

        .glass-collection-btn:hover::before {
            left: 150%;
        }

        /* WHITE LIQUID GLASS POINTER */

        .glass-pointer {
            display: inline-block;
            position: relative;
            z-index: 1;
            color: #fff;
            font-size: 23px;
            font-weight: 400;
            line-height: 1;
            text-shadow: 0 0 12px rgba(255,255,255,0.55);
            transition: transform 0.35s ease, text-shadow 0.35s ease;
            pointer-events: none;
        }

        .glass-collection-btn:hover .glass-pointer {
            transform: translateX(5px);
            text-shadow: 0 0 18px rgba(255,255,255,0.9);
        }

        .products-section {
            max-width: 1200px;
            margin: auto;
            padding: 90px 6% 80px;
        }

        .products-section h1 {
            text-align: center;
            font-size: clamp(35px, 6vw, 60px);
            font-weight: 900;
        }

        .products-intro {
            text-align: center;
            color: #aaa;
            margin: 15px 0 55px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 30px;
        }

        .product-card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            box-shadow: 0 8px 32px rgba(0,0,0,0.25),
                        inset 0 1px 1px rgba(255,255,255,0.15);
        }

        .main-product-image {
            width: 100%;
            aspect-ratio: 4 / 5;
            object-fit: contain;
            background: #111;
            display: block;
        }

        .product-thumbnails {
            display: flex;
            gap: 10px;
            padding: 12px;
        }

        .product-thumbnails img {
            width: 65px;
            height: 75px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.3);
            cursor: pointer;
            opacity: 0.65;
            transition: 0.3s ease;
        }

        .product-thumbnails img:hover,
        .product-thumbnails img.active {
            opacity: 1;
            border-color: white;
            transform: scale(1.05);
        }

        .product-info {
            padding: 15px 20px 22px;
        }

        .product-info h2 {
            font-size: 17px;
            margin-bottom: 10px;
        }

        .product-price {
            font-weight: 800;
            margin-bottom: 18px;
        }

        .order-button {
            display: block;
            text-align: center;
            padding: 14px;
            color: white;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50px;
            background: rgba(255,255,255,0.10);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.2);
            transition: 0.3s ease;
        }

        .order-button:hover {
            background: rgba(255,255,255,0.22);
            transform: translateY(-2px);
        }

        @media(max-width: 700px) {
            .products-grid {
                grid-template-columns: 1fr;
            }

            .products-section {
                padding: 65px 18px;
            }

            .navbar {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <nav class="navbar">

        <a href="index.html" class="logo">
            FREEDOM CULTURE<span>.</span>
        </a>

        <a href="index.html" class="glass-collection-btn">
            BACK HOME
            <span class="glass-pointer">☞</span>
        </a>

    </nav>
</header>

<main class="products-section">

    <h1>THE COLLECTION<span>.</span></h1>

    <p class="products-intro">
        WEAR YOUR FREEDOM. LIVE YOUR CULTURE.
    </p>

    <div class="products-grid">

        <!-- T-SHIRT 01 -->

        <article class="product-card">

            <img class="main-product-image"
                 src="./images/tshirt-01-front.jpg"
                 alt="T-shirt 01"
                 onerror="this.alt='Image not found: tshirt-01-front.jpg'">

            <div class="product-thumbnails">

                <img class="active"
                     src="./images/tshirt-01-front.jpg"
                     onclick="changeImage(this)"
                     alt="Front">

                <img src="./images/tshirt-01-back.jpg"
                     onclick="changeImage(this)"
                     alt="Back">

                <img src="./images/tshirt-01-detail.jpg"
                     onclick="changeImage(this)"
                     alt="Detail">

            </div>

            <div class="product-info">

                <h2>ESSENTIAL T-SHIRT 01</h2>

                <p class="product-price">199 DH</p>

                <a class="order-button"
                   target="_blank"
                   href="https://wa.me/212710822283?text=Hello%20FREEDOM%20CULTURE%2C%20I%20want%20T-shirt%2001">
                    ORDER NOW ↗️
                </a>

            </div>

        </article>


        <!-- T-SHIRT 02 -->

        <article class="product-card">

            <img class="main-product-image"
                 src="./images/tshirt-02-front.jpg"
                 alt="T-shirt 02"
                 onerror="this.alt='Image not found: tshirt-02-front.jpg'">

            <div class="product-thumbnails">

                <img class="active"
                     src="./images/tshirt-02-front.jpg"
                     onclick="changeImage(this)"
                     alt="Front">

                <img src="./images/tshirt-02-back.jpg"
                     onclick="changeImage(this)"
                     alt="Back">

                <img src="./images/tshirt-02-detail.jpg"
                     onclick="changeImage(this)"
                     alt="Detail">

            </div>

            <div class="product-info">

                <h2>ESSENTIAL T-SHIRT 02</h2>

                <p class="product-price">199 DH</p>

                <a class="order-button"
                   target="_blank"
                   href="https://wa.me/212710822283?text=Hello%20FREEDOM%20CULTURE%2C%20I%20want%20T-shirt%2002">
                    ORDER NOW ↗️
                </a>

            </div>

        </article>

    </div>

</main>

<script>
    function changeImage(thumbnail) {

        const card = thumbnail.closest(".product-card");

        const mainImage = card.querySelector(".main-product-image");

        mainImage.src = thumbnail.src;

        card.querySelectorAll(".product-thumbnails img")
            .forEach(img => img.classList.remove("active"));

        thumbnail.classList.add("active");
    }
</script>

</body>
</html>
